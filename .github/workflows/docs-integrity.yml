name: Documentation integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check links and screen inventory
        run: python scripts/check_docs.py
